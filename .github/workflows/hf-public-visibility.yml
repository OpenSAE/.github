name: Public Hugging Face visibility diagnostic
on:
  push:
    branches:
      - diagnostics/hf-public-visibility-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read OpenSAE public Hugging Face resources
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          import urllib.error
          from html import unescape

          targets = [
              ("organization_page", "https://huggingface.co/OpenSAE"),
              ("organization_api", "https://huggingface.co/api/organizations/OpenSAE"),
              ("spaces_api", "https://huggingface.co/api/spaces?author=OpenSAE&limit=100"),
              ("datasets_api", "https://huggingface.co/api/datasets?author=OpenSAE&limit=100"),
              ("models_api", "https://huggingface.co/api/models?author=OpenSAE&limit=100"),
              ("collections_api", "https://huggingface.co/api/collections?owner=OpenSAE"),
              ("organization_card", "https://huggingface.co/spaces/OpenSAE/README/resolve/main/README.md"),
              ("saebase_card", "https://huggingface.co/spaces/OpenSAE/SAEBase/resolve/main/README.md"),
              ("saebase_space", "https://huggingface.co/spaces/OpenSAE/SAEBase"),
          ]
          for name, url in targets:
              print("=== " + name + " ===", flush=True)
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0 (compatible; OpenSAE-public-audit/1.0)",
                          "Accept": "application/json,text/html,text/plain,*/*",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=18) as response:
                      status = response.status
                      mime = response.headers.get("Content-Type", "")
                      final_url = response.url
                      contents = response.read(600000).decode("utf-8", "replace")
                  print("HTTP", status, "MIME", mime, "URL", final_url, "BYTES", len(contents), flush=True)
                  if "application/json" in mime:
                      data = json.loads(contents)
                      if isinstance(data, list):
                          print("COUNT", len(data))
                          for item in data[:60]:
                              print(json.dumps({
                                  k: item.get(k) for k in ("id", "slug", "title", "author", "likes", "downloads", "sdk", "private")
                                  if k in item
                              }, ensure_ascii=False))
                      elif isinstance(data, dict):
                          print(json.dumps({
                              k: data.get(k) for k in ("name", "fullname", "avatarUrl", "description", "website", "members", "numMembers", "repoCount", "isEnterprise", "slug")
                              if k in data
                          }, ensure_ascii=False)[:8000])
                      else:
                          print("UNEXPECTED JSON TYPE")
                  elif name in ("organization_card", "saebase_card"):
                      print(contents[:13500])
                  else:
                      titles = re.findall(r"<title[^>]*>(.*?)</title>", contents, flags=re.S|re.I)
                      descriptions = re.findall(r'<meta[^>]*name="description"[^>]*content="([^"]*)"', contents, flags=re.S|re.I)
                      text = re.sub(r"<(script|style)[^>]*>.*?</\\1>", "", contents, flags=re.S|re.I)
                      text = re.sub(r"<[^>]+>", " ", text)
                      text = re.sub(r"\\s+", " ", unescape(text)).strip()
                      print("TITLE", unescape(titles[0])[:400] if titles else "none")
                      print("DESCRIPTION", descriptions[0][:500] if descriptions else "none")
                      print("VISIBLE_TEXT_SAMPLE", text[:9000])
              except Exception as error:
                  print("ERROR", type(error).__name__, str(error)[:1000], flush=True)
          PY
